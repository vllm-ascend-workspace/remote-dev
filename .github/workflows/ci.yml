name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python3 -m pip install -e ".[test]"
      - name: Unit tests
        # Mocked transports and temporary state only; no SSH, no hardware.
        run: python3 -m pytest
      - name: Local contract gates
        run: remote-dev validate --local-only

  wheel:
    name: Wheel install (P14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python3 -m pip install uv
      - name: Build wheel, install clean venv, import, --help
        run: |
          set -euo pipefail
          uv build
          wheel=$(ls -1 dist/*.whl)
          clean=$(mktemp -d)
          python3 -m venv "$clean/venv"
          "$clean/venv/bin/python" -m pip install "$wheel"
          "$clean/venv/bin/python" -c "import remote_dev; print(remote_dev.__version__)"
          "$clean/venv/bin/remote-dev" --help
