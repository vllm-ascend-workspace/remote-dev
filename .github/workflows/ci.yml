name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Unit tests
        # Mocked transports and temporary state only; no SSH server, no hardware.
        run: python -m pytest --junitxml=contracts.xml
      - name: Publish failing test details
        if: failure()
        run: python tests/ci_failure_summary.py contracts.xml
      - name: Local contract gates
        run: remote-dev validate --local-only

  client-portability:
    name: Client portability (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: All portable client contracts
        # No SSH server. These prove the local macOS/Windows client path:
        # pipe readers, process-group stop, control() JSON stdin shipping,
        # and ordinary job wrappers. Linux worker tests skip off Linux.
        run: python -m pytest -q tests --junitxml=client-portability.xml
      - name: Publish failing test details
        if: failure()
        run: python tests/ci_failure_summary.py client-portability.xml

  wheel:
    name: Wheel install (P14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Build wheel, install clean venv, import, --help, worker source
        run: |
          set -euo pipefail
          uv build
          wheel=$(ls -1 dist/*.whl)
          clean=$(mktemp -d)
          python -m venv "$clean/venv"
          "$clean/venv/bin/python" -m pip install "$wheel"
          "$clean/venv/bin/python" -c "import remote_dev; print(remote_dev.__version__)"
          "$clean/venv/bin/python" -c "from remote_dev.processes import control, worker_source; src=worker_source(); assert callable(control); assert 'PR_SET_CHILD_SUBREAPER' in src; assert 'REMOTE_DEV_JOB_TOKEN' in src; assert 'VAWS_REMOTE_JOB' not in src"
          "$clean/venv/bin/remote-dev" --help
